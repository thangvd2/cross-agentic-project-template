# Pre-commit hooks for <!-- TODO: Replace with project name -->
# Install: pip install -r requirements-dev.txt
#   pre-commit install --install-hooks
#   pre-commit install --hook-type pre-push
# Run manually: pre-commit run --all-files

repos:
  # ── Ruff: lint + format ───────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        name: ruff lint
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^(node_modules/|venv/|\.venv/|dist/|build/)
      - id: ruff-format
        name: ruff format
        exclude: ^(node_modules/|venv/|\.venv/|dist/|build/)

  # ── Secret detection ──────────────────────────────────
  # TODO(secrets): re-enable after generating + tuning .secrets.baseline.
  # Run: detect-secrets scan > .secrets.baseline, then audit false positives.
  # Disabled because baseline file is missing (would fail every commit).
  # - repo: https://github.com/Yelp/detect-secrets
  #   rev: v1.5.0
  #   hooks:
  #     - id: detect-secrets
  #       name: detect secrets
  #       args: ['--baseline', '.secrets.baseline']
  #       exclude: ^(package-lock\.json|venv/|\.venv/|\.secrets\.baseline)

  # ── .ai-sync/ sync enforcement ────────────────────────
  - repo: local
    hooks:
      - id: ai-sync-check
        name: .ai-sync/ sync check (auto-regenerates platform configs)
        entry: python3 .ai-sync/sync.py
        language: system
        files: ^\.ai-sync/
        pass_filenames: false

  # ── Branch protection (defense-in-depth: commit + push stages) ─
  # Runs at BOTH stages:
  #   - pre-commit: block commit creation on master/dev (catches the
  #     case where a hook only fires on push — too late, commit exists)
  #   - pre-push: block push to master/dev remote (last line of defense)
  # Script reads git rev-parse --abbrev-ref HEAD, valid at both stages.
  # Requires .git-hooks/check-protected-branch.sh (shipped in this repo).
  - repo: local
    hooks:
      - id: check-protected-branch
        name: check protected branch (master/dev)
        entry: bash .git-hooks/check-protected-branch.sh
        language: system
        stages: [pre-commit, pre-push]
        pass_filenames: false
        always_run: true

  # ── Pre-push: run tests ───────────────────────────────
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python3 -m pytest tests/ --tb=short -q
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  # ── Optional: ESLint + Prettier (uncomment for frontend projects) ──
